name: Update fuel prices

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install parser dependency
        run: python -m pip install beautifulsoup4

      - name: Fetch AAA national averages
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from bs4 import BeautifulSoup
          from datetime import date

          url = 'https://gasprices.aaa.com/'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          html = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'ignore')
          soup = BeautifulSoup(html, 'html.parser')
          text = ' '.join(soup.stripped_strings)

          # AAA publishes a table in this order:
          # Current Avg. Regular Mid-Grade Premium Diesel E85
          # Yesterday Avg. Regular Mid-Grade Premium Diesel E85
          pattern = re.compile(
              r'Current Avg\.\s*\$([0-9.]+)\s*\$([0-9.]+)\s*\$([0-9.]+)\s*\$([0-9.]+)\s*\$([0-9.]+).*?'
              r'Yesterday Avg\.\s*\$([0-9.]+)\s*\$([0-9.]+)\s*\$([0-9.]+)\s*\$([0-9.]+)\s*\$([0-9.]+)',
              re.S
          )
          m = pattern.search(text)
          if not m:
              raise SystemExit('Could not parse AAA national average table')

          payload = {
              'source': 'AAA Fuel Prices',
              'date': date.today().isoformat(),
              'regular': {
                  'current': float(m.group(1)),
                  'yesterday': float(m.group(6)),
              },
              'diesel': {
                  'current': float(m.group(4)),
                  'yesterday': float(m.group(9)),
              },
          }

          with open('data/fuel-prices.json', 'w') as f:
              json.dump(payload, f, indent=2)
              f.write('\n')
          print(json.dumps(payload, indent=2))
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- data/fuel-prices.json; then
            echo "No fuel price changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel-prices.json
          git commit -m "Update AAA national fuel averages"
          git push
